    /* ── Full-page fixed background ───────────────────────── */
    body {

      background-position: center;
      background-repeat: no-repeat;

    /* Darken overlay — fixed so it covers nav + content + footer */

      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      pointer-events: none;
      z-index: 0;
    }
    /* Stack everything above the overlay */

    /* ── Nav — transparent + frosted pills ────────────────── */

      background: transparent;
      border-bottom: none;
    }
    .nav-name {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .nav-name:hover { opacity: 0.85; text-decoration: none; }

      -webkit-backdrop-filter: blur(8px);
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.22);

    .nav-links a:hover,

      color: #fff;
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
    }

    .home-wrap::before { background: transparent; }

    /* ── Footer — transparent + frosted pill ──────────────── */

    .home-footer-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 0.55rem 1.25rem;
      color: rgba(255, 255, 255, 0.75);

    .home-footer-pill a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .home-footer-pill a:hover { color: #fff; }
